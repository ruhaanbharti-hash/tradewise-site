<script>
/* ================= MODALS: TRADE ================= */
let tradeCtx = {open:false, ticker:null, side:'buy', orderType:'market'};
function openTradeModal(ticker, side){ tradeCtx = {open:true, ticker, side, orderType:'market'}; render(); }
function closeTradeModal(){ tradeCtx.open=false; render(); }
function setTradeSide(side){ tradeCtx.side=side; render(); }
function setOrderType(t){ tradeCtx.orderType=t; render(); }
function renderTradeModal(){
  if(!tradeCtx.open) return '';
  const s = stock(tradeCtx.ticker);
  const holding = S.holdings[tradeCtx.ticker];
  return `<div class="modal-overlay" onclick="if(event.target===this)closeTradeModal()">
    <div class="modal">
      <div class="modal-head"><h3>${tradeCtx.side==='buy'?'Buy':'Sell'} ${s.t}</h3><button class="x-btn" onclick="closeTradeModal()">✕</button></div>
      <div class="seg"><div class="${tradeCtx.side==='buy'?'active':''}" onclick="setTradeSide('buy')">Buy</div><div class="${tradeCtx.side==='sell'?'active':''}" onclick="setTradeSide('sell')">Sell</div></div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;padding:12px;background:var(--bg-elev-2);border-radius:10px;">
        <div><div style="font-weight:700;">${s.t}</div><div class="faint" style="font-size:11.5px;">${s.name}</div></div>
        <div class="mono" style="font-weight:600;">${fmtINR(s.price,2)}</div>
      </div>
      ${s.isReal && s.nativeCurrency==='$'? `<p class="faint" style="font-size:11px;margin-bottom:14px;">Native price ${fmtPrice(s.t, s.nativePrice)} · converted to ₹ at ≈₹${USD_TO_INR}/USD for single-currency portfolio tracking.</p>` : `<div style="margin-bottom:16px;"></div>`}
      <div class="field"><label>Order Type</label>
        <div class="seg"><div class="${tradeCtx.orderType==='market'?'active':''}" onclick="setOrderType('market')">Market</div><div class="${tradeCtx.orderType==='limit'?'active':''}" onclick="setOrderType('limit')">Limit</div></div>
      </div>
      ${tradeCtx.orderType==='limit'? `<div class="field"><label>Limit Price (₹)</label><input id="limitPrice" type="number" value="${s.price.toFixed(2)}"></div>`:''}
      <div class="field"><label>Quantity</label><input id="tradeQty" type="number" min="1" value="1" oninput="updateOrderTotal()"></div>
      ${tradeCtx.side==='sell' && holding? `<div class="faint" style="font-size:12px;margin-bottom:10px;">You own ${holding.qty} shares</div>`:''}
      <div class="order-total"><span class="dim">Estimated Total</span><span class="mono" id="orderTotalVal">${fmtINR(s.price,2)}</span></div>
      ${tradeCtx.side==='buy'? `<div class="faint" style="font-size:12px;margin:6px 0 14px;">${reservedCash()>0 ? `Available to trade: ${fmtINR(availableToTrade())} (${fmtINR(S.cash)} cash − ${fmtINR(reservedCash())} reserved by pending orders)` : `Available cash: ${fmtINR(S.cash)}`}</div>` : `<div class="faint" style="font-size:12px;margin:6px 0 14px;">Available to sell: ${holding?holding.qty:0} shares</div>`}
      <button class="btn ${tradeCtx.side==='buy'?'btn-primary':'btn-loss'} btn-block" onclick="executeTrade()">${tradeCtx.orderType==='limit' ? `Place ${tradeCtx.side==='buy'?'Buy':'Sell'} Limit Order` : `${tradeCtx.side==='buy'?'Confirm Buy':'Confirm Sell'} (Simulated)`}</button>
      <p class="faint" style="font-size:11px;margin-top:10px;text-align:center;">${tradeCtx.orderType==='limit' ? 'This order will sit as Pending and only fill automatically when the simulated price reaches your limit — no real money is used.' : 'This is a simulated trade — no real money is used.'}</p>
    </div>
  </div>`;
}
function updateOrderTotal(){
  const s = stock(tradeCtx.ticker);
  const qty = parseFloat(document.getElementById('tradeQty')?.value)||0;
  const price = tradeCtx.orderType==='limit'? (parseFloat(document.getElementById('limitPrice')?.value)||s.price) : s.price;
  const el = document.getElementById('orderTotalVal'); if(el) el.textContent = fmtINR(qty*price,2);
}
function reservedCash(){
  return (S.pendingOrders||[]).filter(o=>o.status==='pending' && o.side==='buy').reduce((sum,o)=>sum + o.qty*o.limitPrice, 0);
}
function availableToTrade(){ return Math.max(0, S.cash - reservedCash()); }

function executeTrade(){
  const s = stock(tradeCtx.ticker);
  const qty = parseInt(document.getElementById('tradeQty')?.value)||0;
  if(qty<=0 || !Number.isFinite(qty)){ toast('Enter a valid quantity'); return; }

  if(tradeCtx.orderType==='limit'){
    const limitPrice = parseFloat(document.getElementById('limitPrice')?.value);
    if(!limitPrice || limitPrice<=0){ toast('Enter a valid limit price'); return; }
    if(tradeCtx.side==='sell'){
      const h = S.holdings[s.t];
      if(!h || h.qty<qty){ toast("You don't own enough shares to place that sell order"); return; }
    } else {
      // Reserve the cash this order would need — the same money can't back two pending buy orders at once.
      const cost = qty*limitPrice;
      if(cost > availableToTrade()){ toast(`Not enough available cash — ${fmtINR(reservedCash())} is already reserved by other pending buy orders.`); return; }
    }
    const order = {id:Date.now(), ticker:s.t, side:tradeCtx.side, qty, limitPrice, status:'pending', createdAt:new Date().toISOString()};
    S.pendingOrders.unshift(order);
    if(S.userId) persistPendingOrder(order).then(realId=>{ if(realId) order.id=realId; });
    toast(`${tradeCtx.side==='buy'?'Buy':'Sell'} limit order placed for ${qty} ${s.t} @ ${fmtINR(limitPrice,2)} — will fill when price ${tradeCtx.side==='buy'?'drops to or below':'rises to or above'} that level.`, '⏳');
    tradeCtx.open=false; render();
    return;
  }

  // Market order — executes immediately at current simulated price.
  const price = s.price;
  const total = qty*price;
  if(tradeCtx.side==='buy'){
    if(total>availableToTrade()){ toast(reservedCash()>0 ? `Not enough available cash — ${fmtINR(reservedCash())} is reserved by pending buy orders.` : "Not enough virtual cash for this order"); return; }
    S.cash -= total;
    const h = S.holdings[s.t];
    if(h){ h.avgPrice = (h.avgPrice*h.qty + total)/(h.qty+qty); h.qty += qty; }
    else S.holdings[s.t] = {qty, avgPrice:price};
    const tx = {id:Date.now(), ticker:s.t, side:'buy', qty, price, total, date:new Date().toISOString().slice(0,10), orderType:'market'};
    S.transactions.unshift(tx);
    persistHolding(s.t); persistTransaction(tx); persistProfileSoon();
    toast(`Bought ${qty} ${s.t} @ ${fmtINR(price,2)}`, '🟢');
  } else {
    const h = S.holdings[s.t];
    if(!h || h.qty<qty){ toast("You don't own enough shares to sell that quantity"); return; }
    S.cash += total;
    h.qty -= qty;
    if(h.qty===0) delete S.holdings[s.t];
    const tx = {id:Date.now(), ticker:s.t, side:'sell', qty, price, total, date:new Date().toISOString().slice(0,10), orderType:'market'};
    S.transactions.unshift(tx);
    persistHolding(s.t); persistTransaction(tx); persistProfileSoon();
    toast(`Sold ${qty} ${s.t} @ ${fmtINR(price,2)}`, '🔴');
  }
  addXP(5, 'Trade executed');
  tradeCtx.open=false; render();
}

/* ================= MODALS: JOURNAL ================= */
let journalCtx = {open:false, editId:null, closing:false};
function openJournalModal(editId, closing){ journalCtx = {open:true, editId:editId||null, closing:!!closing}; render(); }
function closeJournalModal(){ journalCtx.open=false; render(); }
function renderJournalModal(){
  if(!journalCtx.open) return '';
  const editing = journalCtx.editId? S.journal.find(e=>e.id===journalCtx.editId) : null;
  const closingMode = journalCtx.closing && editing;
  return `<div class="modal-overlay" onclick="if(event.target===this)closeJournalModal()">
    <div class="modal">
      <div class="modal-head"><h3>${closingMode?'Close Trade':(editing?'Edit Journal Entry':'New Journal Entry')}</h3><button class="x-btn" onclick="closeJournalModal()">✕</button></div>
      ${!closingMode? `
      <div class="field"><label>Stock</label><select id="jTicker">${STOCKS.map(s=>`<option value="${s.t}" ${editing?.ticker===s.t?'selected':''}>${s.t} — ${s.name}</option>`).join('')}</select></div>
      <div class="field"><label>Side</label><div class="seg"><div class="${(!editing||editing.side==='buy')?'active':''}" onclick="this.parentNode.querySelectorAll('div').forEach(d=>d.classList.remove('active'));this.classList.add('active');this.dataset.v='buy';journalCtx._side='buy'" data-v="buy">Buy</div><div class="${editing?.side==='sell'?'active':''}" onclick="this.parentNode.querySelectorAll('div').forEach(d=>d.classList.remove('active'));this.classList.add('active');journalCtx._side='sell'" data-v="sell">Sell</div></div></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        <div class="field"><label>Quantity</label><input id="jQty" type="number" value="${editing?.qty||1}"></div>
        <div class="field"><label>Entry Price (₹)</label><input id="jEntry" type="number" value="${editing?.entryPrice||''}"></div>
      </div>
      <div class="field"><label>Date</label><input id="jDate" type="date" value="${editing?.date||new Date().toISOString().slice(0,10)}"></div>
      <div class="field"><label>Strategy</label><input id="jStrategy" placeholder="e.g. Breakout, Value pick" value="${editing?.strategy||''}"></div>
      <div class="field"><label>Reason for trade</label><textarea id="jReason" rows="2" placeholder="Why are you making this trade?">${editing?.reason||''}</textarea></div>
      <div class="field"><label>Confidence (1-5)</label><input id="jConfidence" type="number" min="1" max="5" value="${editing?.confidence||3}"></div>
      <div class="field"><label>Expected outcome</label><input id="jExpected" placeholder="What do you expect to happen?" value="${editing?.expectedOutcome||''}"></div>
      <div class="field"><label>Notes</label><textarea id="jNotes" rows="2">${editing?.notes||''}</textarea></div>
      <button class="btn btn-primary btn-block" onclick="saveJournalEntry(${editing?`'${editing.id}'`:'null'})">Save Entry</button>
      ` : `
      <div class="faint" style="font-size:12.5px;margin-bottom:14px;">${editing.ticker} · ${editing.side.toUpperCase()} ${editing.qty} @ ${fmtINR(editing.entryPrice,2)}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        <div class="field"><label>Exit Price (₹)</label><input id="jExitPrice" type="number" value="${stock(editing.ticker).price.toFixed(2)}"></div>
        <div class="field"><label>Exit Date</label><input id="jExitDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
      </div>
      <div class="field"><label>Actual outcome</label><input id="jActual" placeholder="What actually happened?"></div>
      <div class="field"><label>What went well?</label><textarea id="jWell" rows="2"></textarea></div>
      <div class="field"><label>What went wrong?</label><textarea id="jWrong" rows="2"></textarea></div>
      <div class="field"><label>Lesson learned</label><textarea id="jLesson" rows="2"></textarea></div>
      <button class="btn btn-primary btn-block" onclick="closeJournalTrade('${editing.id}')">Save & Close Trade</button>
      `}
    </div>
  </div>`;
}
function saveJournalEntry(id){
  const side = journalCtx._side || (document.querySelector('#jTicker') ? (S.journal.find(e=>e.id===id)?.side || 'buy') : 'buy');
  const entry = {
    id: id || 'j'+Date.now(),
    ticker: document.getElementById('jTicker').value,
    side: side,
    qty: parseInt(document.getElementById('jQty').value)||1,
    entryPrice: parseFloat(document.getElementById('jEntry').value)||0,
    date: document.getElementById('jDate').value,
    strategy: document.getElementById('jStrategy').value,
    reason: document.getElementById('jReason').value,
    confidence: parseInt(document.getElementById('jConfidence').value)||3,
    expectedOutcome: document.getElementById('jExpected').value,
    notes: document.getElementById('jNotes').value,
  };
  if(id){ const idx=S.journal.findIndex(e=>e.id===id); const old=S.journal[idx]; S.journal[idx]={...old, ...entry}; if(S.userId) persistJournalUpdate(id, S.journal[idx]); toast('Journal entry updated'); }
  else { S.journal.unshift(entry); addXP(8,'Journal entry logged'); toast('Trade journaled','📝');
    if(S.userId) persistJournalEntry(entry).then(realId=>{ if(realId){ entry.id=realId; render(); } }); }
  journalCtx.open=false; render();
}
function closeJournalTrade(id){
  const idx = S.journal.findIndex(e=>e.id===id);
  if(idx<0) return;
  S.journal[idx] = {...S.journal[idx],
    exitPrice: parseFloat(document.getElementById('jExitPrice').value)||0,
    exitDate: document.getElementById('jExitDate').value,
    actualOutcome: document.getElementById('jActual').value,
    whatWentWell: document.getElementById('jWell').value,
    whatWentWrong: document.getElementById('jWrong').value,
    lessonLearned: document.getElementById('jLesson').value,
  };
  if(S.userId) persistJournalUpdate(id, S.journal[idx]);
  addXP(10,'Trade closed & reflected');
  journalCtx.open=false; render(); toast('Trade closed in journal','✅');
}

function renderModals(){ return renderTradeModal() + renderJournalModal(); }

/* ================= CHARTS ================= */
function lineChart(canvasId, labels, data, positive){
  const ctx = document.getElementById(canvasId); if(!ctx) return;
  const color = positive? getCss('--gain') : getCss('--loss');
  const grad = ctx.getContext('2d').createLinearGradient(0,0,0,220);
  grad.addColorStop(0, color+'33'); grad.addColorStop(1, color+'00');
  charts[canvasId] = new Chart(ctx, { type:'line', data:{ labels, datasets:[{data, borderColor:color, backgroundColor:grad, fill:true, tension:.35, pointRadius:0, borderWidth:2}]},
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}, tooltip:{mode:'index', intersect:false}},
      scales:{ x:{display:false}, y:{display:false} } } });
}
function donutChart(canvasId, entries){
  const ctx = document.getElementById(canvasId); if(!ctx) return;
  charts[canvasId] = new Chart(ctx, { type:'doughnut', data:{ labels: entries.map(e=>e.sec), datasets:[{ data: entries.map(e=>e.pct), backgroundColor: entries.map(e=>SECTOR_COLORS[e.sec]||SECTOR_COLORS.Other), borderWidth:0 }] },
    options:{ responsive:true, maintainAspectRatio:false, cutout:'68%', plugins:{legend:{display:false}} } });
}
function getCss(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

function afterRender(){
  if(typeof Chart==='undefined') return;
  try{
  if(S.screen==='landing'){
    const h = genHistory('heroChart', 104850, 30, 0.12);
    lineChart('heroChart', h.map((_,i)=>i), h, true);
  }
  if(S.screen==='app'){
    if(S.route==='dashboard'){
      if(!S.portfolioHistCache) S.portfolioHistCache = {};
      const tf = S.dashTF||'1M';
      const tfPoints = {'1D':40,'1W':42,'1M':30,'3M':90,'6M':180,'1Y':52,'All':104}[tf]||30;
      if(!S.portfolioHistCache[tf]) S.portfolioHistCache[tf] = genHistory('portfolio_'+tf, 100000, tfPoints, 0.1);
      const base = S.portfolioHistCache[tf];
      const pv = portfolioValue();
      const scaled = base.map((v,i)=> i===base.length-1? pv : v*(pv/base[base.length-1]));
      lineChart('dashChart', scaled.map((_,i)=>i), scaled, scaled[scaled.length-1]>=scaled[0]);
    }
    if(S.route==='markets'){
      const h = getHistory('NIFTY50', INDICES[0].price, 0.09, '3M');
      lineChart('marketChart', h.map((_,i)=>i), h, h[h.length-1]>=h[0]);
    }
    if(S.route==='stock'){
      const s = stock(S.selectedTicker);
      if(s.isReal && !s.unresolved){
        loadDailySeriesIfNeeded(s.t);
        const cached = dailySeriesCache[s.t];
        if(cached && cached.state==='ready' && cached.series.length){
          const tfDays = {'1M':22,'3M':65,'Max':100}[S.stockTF] || 65;
          const slice = cached.series.slice(-tfDays);
          const vals = slice.map(p=>p.close);
          lineChart('stockChart', slice.map(p=>p.date.slice(5)), vals, vals[vals.length-1]>=vals[0]);
        }
      } else if(!s.isReal) {
        const h = getHistory(s.t, s.price, s.vol, S.stockTF);
        lineChart('stockChart', h.map((_,i)=>i), h, h[h.length-1]>=h[0]);
      }
    }
    if(S.route==='doctor'){
      const d = computeDoctor();
      if(d.sectorPct.length) donutChart('doctorDonut', d.sectorPct);
    }
  }
  }catch(e){ console.warn('Chart render skipped:', e); }
}

/* boot */
document.documentElement.setAttribute('data-theme', S.theme);
bootAuth();
</script>
</body>
