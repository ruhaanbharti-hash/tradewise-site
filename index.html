<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TradeWise — Learn. Trade. Analyze. Improve.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
/* ============ DESIGN TOKENS — warm editorial paper-market theme ============ */
:root[data-theme="light"]{
  --bg:#F7F1E6; --bg-elev:#FBF7EF; --bg-elev-2:#F1E9D8; --border:#E5D9C3;
  --text:#221D17; --text-dim:#6E6255; --text-faint:#9C9184;
  --accent:#C1502E; --accent-ink:#FBF3E7; --accent-dim:#A6431F;
  --gain:#3B6B4A; --loss:#B23A2E; --amber:#C1852E; --indigo:#5C6B8C;
  --ink-pill:#231F1B; --ink-pill-text:#F7F1E6;
  --shadow: 0 2px 10px rgba(74,58,33,.06);
}
:root[data-theme="dark"]{
  --bg:#1B1712; --bg-elev:#241F18; --bg-elev-2:#2C261D; --border:#3A3226;
  --text:#F3EBDC; --text-dim:#B7A88F; --text-faint:#83765F;
  --accent:#E07A50; --accent-ink:#241108; --accent-dim:#C1502E;
  --gain:#6FAE83; --loss:#E0776A; --amber:#E0A758; --indigo:#9AA8C9;
  --ink-pill:#F3EBDC; --ink-pill-text:#231F1B;
  --shadow: 0 4px 18px rgba(0,0,0,.28);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  background:var(--bg); color:var(--text);
  font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;
  transition:background .25s ease, color .25s ease;
}
h1,h2,h3,.serif{ font-family:'Fraunces',serif; letter-spacing:-0.015em; font-weight:600; }
.mono{ font-family:'IBM Plex Mono',monospace; font-feature-settings:"tnum"; }
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer;}
ul{list-style:none;}
img{max-width:100%; display:block;}
::selection{background:var(--accent); color:var(--accent-ink);}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px;}

.gain{color:var(--gain);} .loss{color:var(--loss);}
.dim{color:var(--text-dim);}
.faint{color:var(--text-faint);}

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:12px 22px; border-radius:999px; border:1px solid transparent;
  font-size:14px; font-weight:600; transition:transform .12s ease, opacity .12s ease, background .15s ease;
  white-space:nowrap;
}
.btn:active{ transform:scale(0.97); }
.btn-primary{ background:var(--accent); color:var(--accent-ink); }
.btn-primary:hover{ opacity:.88; }
.btn-ghost{ background:transparent; color:var(--text); border-color:var(--border); }
.btn-ghost:hover{ background:var(--bg-elev-2); }
.btn-loss{ background:var(--loss); color:#fff; }
.btn-loss:hover{ opacity:.88; }
.btn-sm{ padding:7px 15px; font-size:13px; border-radius:999px; }
.btn-block{ width:100%; }
.btn:disabled{ opacity:.45; cursor:not-allowed; }

.card{
  background:var(--bg-elev-2); border:1px solid transparent; border-radius:18px;
  padding:20px;
}
.card-flat{
  background:var(--bg-elev); border-radius:14px; padding:16px;
}
.eyebrow{ font-size:11.5px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); margin-bottom:10px; }
.eyebrow-light{ color:var(--amber); }
.dark-card{ background:var(--ink-pill); color:var(--ink-pill-text); border-radius:18px; padding:20px; }
.dark-card .dim{ color:color-mix(in srgb, var(--ink-pill-text) 65%, transparent); }
.dark-card .mini-eyebrow{ font-size:11px; letter-spacing:.08em; text-transform:uppercase; font-weight:700; opacity:.8; }
.dark-card .progress-bar{ background:color-mix(in srgb, var(--ink-pill-text) 18%, transparent); }
.dark-card .progress-bar > i{ background:var(--amber); }
.step-pill{ display:block; width:100%; text-align:left; padding:12px 16px; border-radius:999px; background:var(--bg-elev); font-size:13.5px; font-weight:600; color:var(--text); border:none; margin-bottom:9px; }
.step-pill:last-child{ margin-bottom:0; }
.step-pill:hover{ background:color-mix(in srgb, var(--accent) 10%, var(--bg-elev)); }
.pill{
  display:inline-flex; align-items:center; gap:6px; padding:5px 12px; border-radius:999px;
  font-size:12px; font-weight:600; border:1px solid var(--border); color:var(--text-dim);
}
.pill-accent{ background:color-mix(in srgb, var(--accent) 14%, transparent); color:var(--accent); border-color:transparent; }
.pill-amber{ background:color-mix(in srgb, var(--amber) 16%, transparent); color:var(--amber); border-color:transparent; }
.pill-loss{ background:color-mix(in srgb, var(--loss) 14%, transparent); color:var(--loss); border-color:transparent; }
.pill-gain{ background:color-mix(in srgb, var(--gain) 14%, transparent); color:var(--gain); border-color:transparent; }
.pill-dot{ background:var(--bg-elev); border:1px solid var(--border); }
.pill-dot i{ width:7px;height:7px;border-radius:50%; background:var(--gain); display:inline-block; }
.btn-dark{ background:var(--ink-pill); color:var(--ink-pill-text); }
.btn-dark:hover{ opacity:.88; }
.brand-sub{ font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--text-faint); font-weight:600; margin-left:2px; }

input,select,textarea{
  width:100%; background:var(--bg-elev-2); border:1px solid var(--border); color:var(--text);
  padding:11px 13px; border-radius:9px; font-size:14px; font-family:inherit; outline:none;
  transition:border-color .15s ease;
}
input:focus,select:focus,textarea:focus{ border-color:var(--accent); }
label{ font-size:12.5px; font-weight:600; color:var(--text-dim); display:block; margin-bottom:6px; }
.field{ margin-bottom:16px; }

.container{ max-width:1180px; margin:0 auto; padding:0 24px; }
.grid{ display:grid; gap:16px; }
.hidden{ display:none !important; }

.table-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; margin:0 -2px; }
table{ width:100%; border-collapse:collapse; font-size:13.5px; min-width:560px; }
th{ text-align:left; padding:10px 12px; color:var(--text-faint); font-weight:600; font-size:12px; text-transform:none; border-bottom:1px solid var(--border); }
td{ padding:12px; border-bottom:1px solid var(--border); }
tr:last-child td{ border-bottom:none; }
tr.rowhover:hover{ background:var(--bg-elev-2); cursor:pointer; }

.badge-icon{ width:42px;height:42px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:19px; background:var(--bg-elev-2); border:1px solid var(--border); flex-shrink:0;}

/* focus visibility */
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible{
  outline:2px solid var(--accent); outline-offset:2px;
}
@media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }

/* ============ SCAFFOLD ============ */
#root{ min-height:100vh; }
.toast-wrap{ position:fixed; bottom:20px; right:20px; z-index:999; display:flex; flex-direction:column; gap:8px; }
.toast{ background:var(--bg-elev); border:1px solid var(--border); padding:12px 16px; border-radius:10px; font-size:13.5px; box-shadow:0 8px 24px rgba(0,0,0,.25); animation:toastin .2s ease; max-width:300px;}
@keyframes toastin{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }

/* spinner */
.spin{ width:16px;height:16px;border-radius:50%; border:2px solid var(--border); border-top-color:var(--accent); animation:spin .7s linear infinite; display:inline-block;}
.feat-stock-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
.feat-stock-card{ background:var(--bg-elev); border-radius:12px; padding:14px; cursor:pointer; transition:background .15s; }
.feat-stock-card:hover{ background:color-mix(in srgb, var(--accent) 6%, var(--bg-elev)); }
@media (max-width: 900px){ .feat-stock-grid{ grid-template-columns:repeat(2,1fr); } }
@media (max-width: 480px){ .feat-stock-grid{ grid-template-columns:1fr; } .stat-grid{ grid-template-columns:1fr !important; } }
@keyframes spin{ to{ transform:rotate(360deg); } }
.skel{ background:linear-gradient(90deg, var(--bg-elev-2) 25%, var(--border) 37%, var(--bg-elev-2) 63%); background-size:400% 100%; animation:shimmer 1.4s ease infinite; border-radius:8px; }
@keyframes shimmer{ 0%{background-position:100% 50%;} 100%{background-position:0 50%;} }

/* ============ LANDING ============ */
.landing-nav{ position:sticky; top:0; z-index:50; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--border); }
.landing-nav .container{ display:flex; align-items:center; justify-content:space-between; height:68px; }
.brand{ display:flex; align-items:center; gap:9px; font-weight:700; font-size:18px; }
.brand-mark{ width:30px;height:30px;border-radius:50%; background:var(--accent); display:flex; align-items:center;justify-content:center; color:var(--accent-ink); font-size:15px; font-weight:700; font-family:'Fraunces',serif;}
.nav-links{ display:flex; gap:28px; font-size:14px; color:var(--text-dim); }
.nav-links a:hover{ color:var(--text); }
.nav-actions{ display:flex; gap:10px; align-items:center; }

.hero{ padding:88px 0 60px; background:radial-gradient(ellipse 900px 500px at 15% 0%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 70%); }
.hero-grid{ display:grid; grid-template-columns:1.05fr 1fr; gap:60px; align-items:center; }
.hero h1{ font-size:64px; line-height:1.0; font-weight:600; margin-bottom:22px; }
.hero p.lead{ font-size:17.5px; color:var(--text-dim); line-height:1.6; max-width:480px; margin-bottom:30px; }
.hero-ctas{ display:flex; gap:12px; margin-bottom:40px; }
.trust-row{ display:flex; gap:36px; flex-wrap:wrap; }
.trust-stat .n{ font-family:'Fraunces',serif; font-size:26px; font-weight:600; }
.trust-stat .l{ font-size:12px; color:var(--text-faint); margin-top:2px; }

.mock-window{ background:var(--bg-elev); border:1px solid var(--border); border-radius:26px; overflow:hidden; box-shadow:0 30px 70px -24px rgba(74,58,33,.28); padding:22px;}
.mock-eyebrow{ font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--text-faint); font-weight:700; margin-bottom:6px;}
.mock-head-row{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:16px;}
.mock-total{ font-family:'IBM Plex Mono',monospace; font-size:30px; font-weight:600; }
.mock-chip{ background:color-mix(in srgb, var(--gain) 15%, transparent); color:var(--gain); font-size:12px; font-weight:700; padding:6px 12px; border-radius:999px;}
.mock-body{ padding:0; }
.mock-inner-card{ background:var(--bg-elev-2); border-radius:16px; padding:14px 16px; margin-bottom:12px;}
.mock-inner-top{ display:flex; justify-content:space-between; font-size:12.5px; color:var(--text-dim); margin-bottom:12px;}
.mock-bars{ display:flex; align-items:flex-end; gap:7px; height:70px;}
.mock-bars i{ flex:1; border-radius:5px 5px 0 0; background:color-mix(in srgb, var(--gain) 30%, var(--bg-elev-2)); }
.mock-bars i:last-child{ background:var(--gain); }
.mock-list-row{ display:flex; align-items:center; justify-content:space-between; padding:10px 2px; border-bottom:1px solid var(--border); font-size:13.5px;}
.mock-list-row:last-child{border:none;}
.mock-dot-lbl{ display:flex; align-items:center; gap:9px; font-weight:600; }
.mock-dot-lbl i{ width:8px;height:8px;border-radius:50%; flex-shrink:0; }
.mock-footer{ background:var(--ink-pill); color:var(--ink-pill-text); border-radius:16px; padding:14px 16px; margin-top:4px;}
.mock-footer-top{ display:flex; justify-content:space-between; font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; font-weight:700; margin-bottom:10px; opacity:.85;}
.mock-progress{ height:6px; border-radius:6px; background:rgba(247,241,230,.18); overflow:hidden; margin-bottom:10px;}
.mock-progress i{ display:block; height:100%; background:var(--accent); }
.mock-footer-sub{ font-size:12px; opacity:.75; }

.section{ padding:76px 0; border-top:1px solid var(--border); }
.section-head{ max-width:560px; margin-bottom:42px; }
.section-head h2{ font-size:34px; font-weight:600; margin-bottom:12px; }
.section-head p{ color:var(--text-dim); font-size:15.5px; line-height:1.6; }
.how-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:18px; }
.how-card{ padding:26px 24px; border-radius:22px; background:var(--bg-elev-2); }
.how-card .n{ font-family:'Fraunces',serif; font-size:38px; font-weight:600; color:color-mix(in srgb, var(--accent) 42%, var(--bg-elev-2)); margin-bottom:12px; line-height:1; }
.how-card h3{ font-size:18px; font-weight:700; margin-bottom:8px; font-family:'Inter',sans-serif;}
.how-card p{ font-size:13.8px; color:var(--text-dim); line-height:1.55; }

.feat-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }
.feat-card{ padding:26px 24px; border:none; border-radius:22px; background:var(--bg-elev-2); }
.feat-card .fi{ width:52px;height:52px; border-radius:50%; display:flex;align-items:center;justify-content:center; font-size:21px; margin-bottom:18px; background:var(--bg-elev); }
.feat-card .fi.fi-sage{ background:color-mix(in srgb, var(--gain) 20%, var(--bg-elev)); }
.feat-card .fi.fi-rose{ background:color-mix(in srgb, var(--loss) 16%, var(--bg-elev)); }
.feat-card .fi.fi-peach{ background:color-mix(in srgb, var(--amber) 22%, var(--bg-elev)); }
.feat-card .fi.fi-mint{ background:color-mix(in srgb, var(--gain) 26%, var(--bg-elev)); }
.feat-card .fi.fi-dark{ background:var(--ink-pill); }
.feat-card .fi.fi-sky{ background:color-mix(in srgb, var(--indigo) 22%, var(--bg-elev)); }
.feat-card h3{ font-size:17px; margin-bottom:8px; font-weight:700; font-family:'Fraunces',serif;}
.feat-card p{ font-size:13.5px; color:var(--text-dim); line-height:1.55; }
.feat-mini-row{ display:flex; align-items:center; justify-content:space-between; padding:6px 0; font-size:13px; }
.feat-mini-row .pill{ background:var(--bg-elev); }

.safety-box{ background:var(--ink-pill); color:var(--ink-pill-text); border-radius:24px; padding:44px; }
.safety-box h3{ font-size:30px; margin-bottom:14px; font-weight:600; max-width:640px; line-height:1.2; }
.safety-box p{ color:color-mix(in srgb, var(--ink-pill-text) 68%, transparent); font-size:14.5px; line-height:1.6; max-width:560px; }
.safety-list{ margin-top:22px; display:flex; gap:10px; flex-wrap:wrap; }
.safety-list .pill{ border-color:color-mix(in srgb, var(--ink-pill-text) 25%, transparent); color:var(--ink-pill-text); }

footer{ border-top:1px solid var(--border); padding:36px 0; font-size:13px; color:var(--text-faint); display:flex; justify-content:space-between; align-items:center;}

/* ============ AUTH ============ */
.auth-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
.auth-card{ width:100%; max-width:400px; }
.auth-head{ text-align:left; margin-bottom:26px; }
.auth-head h1{ font-size:32px; margin-bottom:8px; }
.auth-head p{ color:var(--text-dim); font-size:14px; }
.auth-switch{ text-align:center; margin-top:18px; font-size:13.5px; color:var(--text-dim); }
.auth-switch a{ color:var(--accent); font-weight:600; }
.divider{ display:flex; align-items:center; gap:12px; color:var(--text-faint); font-size:12px; margin:20px 0; }
.divider::before, .divider::after{ content:''; flex:1; height:1px; background:var(--border); }
.auth-card input{ border-radius:999px; padding:15px 22px; background:var(--bg-elev-2); border:1px solid transparent; }
.pass-field{ position:relative; }
.pass-field input{ padding-right:48px; }
.pass-toggle{ position:absolute; right:6px; top:50%; transform:translateY(-50%); background:transparent; border:none; font-size:16px; cursor:pointer; width:36px; height:36px; border-radius:50%; opacity:.65; }
.pass-toggle:hover{ opacity:1; background:color-mix(in srgb, var(--accent) 10%, transparent); }
.auth-card .field{ margin-bottom:14px; }
.btn-google{ background:var(--bg-elev-2); color:var(--text); border:1px solid transparent; border-radius:999px; padding:15px 22px; font-weight:700; }
.btn-google:hover{ background:color-mix(in srgb, var(--accent) 8%, var(--bg-elev-2)); }
.divider::before,.divider::after{ content:''; flex:1; height:1px; background:var(--border); }

.opt-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.opt-card{ border:1.5px solid var(--border); border-radius:12px; padding:16px; text-align:left; background:var(--bg-elev); transition:border-color .15s; }
.opt-card:hover{ border-color:var(--text-faint); }
.opt-card.sel{ border-color:var(--accent); background:rgba(23,214,180,.08); }
.opt-card .oi{ font-size:20px; margin-bottom:8px; }
.opt-card .ot{ font-weight:700; font-size:14px; margin-bottom:3px; }
.opt-card .od{ font-size:12px; color:var(--text-dim); }
.onboard-progress{ display:flex; gap:6px; margin-bottom:26px; }
.onboard-progress i{ flex:1; height:3px; border-radius:3px; background:var(--border); }
.onboard-progress i.on{ background:var(--accent); }

/* ============ APP SHELL ============ */
.app-shell{ display:flex; flex-direction:column; min-height:100vh; }
.app-header{ border-bottom:1px solid var(--border); }
.app-header-row{ display:flex; align-items:center; justify-content:space-between; height:64px; }
.level-pill{ display:inline-flex; align-items:center; padding:7px 14px; border-radius:999px; border:1px solid var(--border); font-size:12.5px; font-weight:600; color:var(--text-dim); background:var(--bg-elev); }
.app-nav-bar{ display:flex; align-items:center; gap:6px; height:54px; border-bottom:1px solid var(--border); overflow-x:auto; }
.app-nav-pill{ display:flex; align-items:center; gap:7px; padding:9px 15px; border-radius:999px; font-size:13.5px; font-weight:600; color:var(--text-dim); white-space:nowrap; flex-shrink:0; }
.app-nav-pill:hover{ color:var(--text); }
.app-nav-pill.active{ background:var(--bg-elev-2); color:var(--text); }
.app-nav-pill .ic{ font-size:15px; }
.more-menu-wrap{ position:relative; }
.more-menu{ position:absolute; top:calc(100% + 8px); right:0; width:200px; background:var(--bg-elev); border:1px solid var(--border); border-radius:14px; padding:6px; box-shadow:0 20px 50px rgba(0,0,0,.22); z-index:100; }
.more-menu a{ display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:9px; font-size:13.5px; color:var(--text); }
.more-menu a:hover{ background:var(--bg-elev-2); }

.icon-btn{ width:36px;height:36px; border-radius:9px; display:flex; align-items:center; justify-content:center; border:1px solid var(--border); background:var(--bg-elev); font-size:15px; position:relative; }
.icon-btn:hover{ background:var(--bg-elev-2); }
.dot-badge{ position:absolute; top:6px; right:6px; width:7px;height:7px;border-radius:50%; background:var(--loss); }
.avatar{ width:34px;height:34px; border-radius:50%; background:var(--indigo); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; }
.content{ padding:32px 0 60px; flex:1; min-width:0; width:100%; max-width:100%; }
.page-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; flex-wrap:wrap; gap:10px;}
.page-head > div:first-child{ min-width:0; }
.page-head h1{ overflow-wrap:break-word; }
.page-head h1{ font-size:28px; font-weight:600; }
.page-head .sub{ color:var(--text-dim); font-size:13.5px; margin-top:4px; }

.bottom-nav{ display:none; }

/* dashboard */
.stat-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:20px;}
.stat-card .l{ font-size:11px; color:var(--text-faint); margin-bottom:10px; text-transform:uppercase; letter-spacing:.07em; font-weight:700; }
.stat-card .v{ font-family:'IBM Plex Mono',monospace; font-size:21px; font-weight:600; }
.dash-2col{ display:grid; grid-template-columns:2fr 1fr; gap:16px; margin-bottom:16px; }
.tab-row{ display:flex; gap:4px; background:var(--bg-elev-2); padding:4px; border-radius:9px; width:fit-content; margin-bottom:14px;}
.tab{ padding:6px 13px; border-radius:7px; font-size:12.5px; font-weight:600; color:var(--text-dim); }
.tab.active{ background:var(--bg-elev); color:var(--text); box-shadow:0 1px 3px rgba(0,0,0,.15); }
.chart-box{ height:230px; position:relative; }
.chart-box canvas{ max-width:100% !important; }
.quick-actions{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.qa-btn{ display:flex; flex-direction:column; align-items:center; gap:7px; padding:16px 8px; border:1px solid var(--border); border-radius:11px; background:var(--bg-elev); font-size:12px; font-weight:600; text-align:center;}
.qa-btn:hover{ border-color:var(--accent); }

/* pricing */

}
.mobile-only-cards{ display:none; }
.holding-card{ background:var(--bg-elev); border-radius:12px; padding:14px; margin-bottom:10px; cursor:pointer; }

<body>
<div id="root"></div>
<div class="toast-wrap" id="toastWrap"></div>
<script>
/* =========================================================================
   TRADEWISE BACKEND INTEGRATION — Supabase auth + Postgres persistence.
   This is the ONLY layer that talks to Supabase. Frontend state (S) is
   hydrated from here on login, and every mutating user action writes
   through to the database here. No API keys of any kind live in this file.
   ========================================================================= */
const SUPA_URL = 'https://ludmrktyyvrbfytvwjin.supabase.co';
const SUPA_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx1ZG1ya3R5eXZyYmZ5dHZ3amluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxNzA1MTYsImV4cCI6MjEwMzc0NjUxNn0.my8EdhCR1hXQK3t3DbYgvE_p3LWuYFeND-QsJc5P2J0';
let sb = null;
let BACKEND_UNAVAILABLE = false;
try{
  if(!window.supabase) throw new Error('Supabase SDK failed to load (network/ad-blocker?)');
  sb = window.supabase.createClient(SUPA_URL, SUPA_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
}catch(e){
  console.error('Backend unavailable:', e);
  BACKEND_UNAVAILABLE = true;
}

let AUTH_ERROR = null; // shown inline on the auth form
let AUTH_BUSY = false;

async function callAI(feature, prompt){
  const { data: { session } } = await sb.auth.getSession();
  if(!session) throw new Error('Not signed in.');
  const resp = await fetch(SUPA_URL + '/functions/v1/ai-proxy', {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + session.access_token },
    body: JSON.stringify({ feature, prompt })
  });
  let body;
  try{ body = await resp.json(); }catch(e){ throw new Error('AI service returned an unexpected response.'); }
  if(!resp.ok) throw new Error((body && body.error) || ('AI service error (' + resp.status + ')'));
  return body.result;
}

/* ---------- AUTH ---------- */
async function realSignUp(name, email, password, confirmPassword){
  AUTH_ERROR = null;
  if(BACKEND_UNAVAILABLE){ AUTH_ERROR = 'Cannot reach the backend service right now. Please refresh and try again.'; render(); return; }
  if(!name || !name.trim()) { AUTH_ERROR = 'Please enter your name'; render(); return; }
  if(!/^\S+@\S+\.\S+$/.test(email||'')) { AUTH_ERROR = 'Please enter a valid email address'; render(); return; }
  if(!password || password.length < 8) { AUTH_ERROR = 'Password must be at least 8 characters'; render(); return; }
  if(password !== confirmPassword) { AUTH_ERROR = 'Passwords do not match'; render(); return; }
  AUTH_BUSY = true; render();
  const { data, error } = await sb.auth.signUp({ email, password, options: { data: { name } } });
  AUTH_BUSY = false;
  if(error){
    if(/already registered|already exists|User already registered/i.test(error.message)) AUTH_ERROR = 'An account with this email already exists. Try logging in instead.';
    else AUTH_ERROR = error.message;
    render(); return;
  }
  if(data.session){
    await hydrateUserData();
    authDraft={name:'',email:'',pass:'',pass2:''};
    S.authMode='onboard'; S.onboardStep=0; render();
  } else {
    AUTH_ERROR = null;
    S.authMode='login';
    render();
    toast('Account created — check your email to confirm, then log in.', '📧');
  }
}
async function realLogin(email, password){
  AUTH_ERROR = null;
  if(BACKEND_UNAVAILABLE){ AUTH_ERROR = 'Cannot reach the backend service right now. Please refresh and try again.'; render(); return; }
  if(!/^\S+@\S+\.\S+$/.test(email||'')) { AUTH_ERROR = 'Please enter a valid email address'; render(); return; }
  if(!password) { AUTH_ERROR = 'Please enter your password'; render(); return; }
  AUTH_BUSY = true; render();
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  AUTH_BUSY = false;
  if(error){
    if(/Invalid login credentials/i.test(error.message)) AUTH_ERROR = 'Incorrect email or password.';
    else if(/Email not confirmed/i.test(error.message)) AUTH_ERROR = 'Please confirm your email before logging in.';
    else AUTH_ERROR = error.message;
    render(); return;
  }
  await hydrateUserData();
  authDraft={name:'',email:'',pass:'',pass2:''};
  S.screen='app'; S.route='dashboard'; render();
  toast('Welcome back, ' + (S.user.name||'Trader').split(' ')[0] + '!','👋');
}
async function realForgotPassword(email){
  AUTH_ERROR = null;
  if(BACKEND_UNAVAILABLE){ AUTH_ERROR = 'Cannot reach the backend service right now. Please refresh and try again.'; render(); return; }
  if(!/^\S+@\S+\.\S+$/.test(email||'')) { AUTH_ERROR = 'Please enter a valid email address'; render(); return; }
  AUTH_BUSY = true; render();
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.href });
  AUTH_BUSY = false;
  if(error){ AUTH_ERROR = error.message; render(); return; }
  toast('Password reset link sent — check your email.', '📧');
  S.authMode='login'; render();
}
async function realLogout(){
  if(sb) await sb.auth.signOut();
  Object.assign(S, freshLocalState());
  S.screen='landing'; S.route='dashboard'; S.moreMenuOpen=false;
  render(); toast('Signed out','👋');
}

/* ---------- DATA HYDRATION (on login / session restore) ---------- */
async function hydrateUserData(){
  const { data: { user } } = await sb.auth.getUser();
  if(!user) return;
  S.userId = user.id;
  S.user.email = user.email;

  const [profileRes, holdingsRes, txRes, watchRes, journalRes, lessonsRes, badgesRes, ordersRes, notifRes] = await Promise.all([
    sb.from('profiles').select('*').eq('user_id', user.id).maybeSingle(),
    sb.from('holdings').select('*').eq('user_id', user.id),
    sb.from('transactions').select('*').eq('user_id', user.id).order('created_at',{ascending:false}),
    sb.from('watchlist').select('ticker').eq('user_id', user.id),
    sb.from('journal_entries').select('*').eq('user_id', user.id).order('created_at',{ascending:false}),
    sb.from('completed_lessons').select('lesson_id').eq('user_id', user.id),
    sb.from('badges').select('badge_id').eq('user_id', user.id),
    sb.from('pending_orders').select('*').eq('user_id', user.id).order('created_at',{ascending:false}),
    sb.from('notifications').select('*').eq('user_id', user.id).order('created_at',{ascending:false}).limit(20),
  ]);

  const p = profileRes.data;
  if(p){
    S.user.name = p.name || '';
    S.user.experience = p.experience || '';
    S.user.goals = p.goals || [];
    S.user.plan = p.plan || 'free';
    S.cash = Number(p.cash);
    S.xp = p.xp;
  }
  S.holdings = {};
  (holdingsRes.data||[]).forEach(function(h){ S.holdings[h.ticker] = {qty:Number(h.qty), avgPrice:Number(h.avg_price)}; });
  S.transactions = (txRes.data||[]).map(function(t){ return {id:t.id, ticker:t.ticker, side:t.side, qty:Number(t.qty), price:Number(t.price), total:Number(t.qty)*Number(t.price), date:t.created_at.slice(0,10), orderType:t.order_type}; });
  S.watchlist = (watchRes.data||[]).map(function(w){ return w.ticker; });
  S.journal = (journalRes.data||[]).map(function(j){
    const d = j.details || {};
    return {
      id:j.id, ticker:j.ticker, side:j.side, qty:j.qty, entryPrice:j.entry_price, exitPrice:j.exit_price,
      reason:j.reasoning, notes:j.notes, whatWentWell:j.lessons_learned, date:(d.date || j.created_at.slice(0,10)),
      strategy:d.strategy||'', confidence:d.confidence||null, expectedOutcome:d.expectedOutcome||'',
      actualOutcome:d.actualOutcome||'', whatWentWrong:d.whatWentWrong||'', exitDate:d.exitDate||null,
    };
  });
  S.completedLessons = (lessonsRes.data||[]).map(function(l){ return l.lesson_id; });
  S.badges = (badgesRes.data||[]).map(function(b){ return b.badge_id; });
  S.pendingOrders = (ordersRes.data||[]).map(function(o){ return {id:o.id, ticker:o.ticker, side:o.side, qty:Number(o.qty), limitPrice:Number(o.limit_price), status:o.status, createdAt:o.created_at}; });
  S.notifications = (notifRes.data||[]).map(function(n){ return {id:n.id, ic:n.icon, t:n.message, read:n.read}; });
}
function freshLocalState(){
  return { userId:null, holdings:{}, transactions:[], watchlist:[], journal:[], completedLessons:[], badges:[],
    pendingOrders:[], notifications:[], cash:100000, xp:0, user:{name:'',email:'',experience:'',goals:[],plan:'free'} };
}

/* ---------- WRITE-THROUGH PERSISTENCE ---------- */
let _profileSaveTimer=null;
function persistProfileSoon(){
  if(!S.userId) return;
  clearTimeout(_profileSaveTimer);
  _profileSaveTimer = setTimeout(async function(){
    const { error } = await sb.from('profiles').update({ cash:S.cash, xp:S.xp, name:S.user.name, experience:S.user.experience, goals:S.user.goals, onboarded:true, updated_at:new Date().toISOString() }).eq('user_id', S.userId);
    if(error) console.warn('Profile save failed', error);
  }, 400);
}
async function persistHolding(ticker){
  if(!S.userId) return;
  const h = S.holdings[ticker];
  if(!h){ const r = await sb.from('holdings').delete().eq('user_id',S.userId).eq('ticker',ticker); if(r.error) console.warn(r.error); return; }
  const { error } = await sb.from('holdings').upsert({ user_id:S.userId, ticker:ticker, qty:h.qty, avg_price:h.avgPrice, updated_at:new Date().toISOString() }, { onConflict:'user_id,ticker' });
  if(error) console.warn('Holding save failed', error);
}
async function persistTransaction(tx){
  if(!S.userId) return;
  const { error } = await sb.from('transactions').insert({ user_id:S.userId, ticker:tx.ticker, side:tx.side, qty:tx.qty, price:tx.price, order_type:tx.orderType });
  if(error) console.warn('Transaction save failed', error);
}
async function persistWatchlistAdd(ticker){ if(!S.userId) return; const r = await sb.from('watchlist').insert({user_id:S.userId, ticker:ticker}); if(r.error) console.warn(r.error); }
async function persistWatchlistRemove(ticker){ if(!S.userId) return; const r = await sb.from('watchlist').delete().eq('user_id',S.userId).eq('ticker',ticker); if(r.error) console.warn(r.error); }
async function persistJournalEntry(entry){
  if(!S.userId) return null;
  const { data, error } = await sb.from('journal_entries').insert({ user_id:S.userId, ticker:entry.ticker, side:entry.side, qty:entry.qty||null, entry_price:entry.entryPrice||null, exit_price:entry.exitPrice||null, reasoning:entry.reason||'', notes:entry.notes||'', lessons_learned:entry.whatWentWell||'',
    details:{ strategy:entry.strategy||'', confidence:entry.confidence||null, expectedOutcome:entry.expectedOutcome||'', date:entry.date||null } }).select().single();
  if(error){ console.warn('Journal save failed', error); return null; }
  return data.id;
}
async function persistJournalUpdate(id, entry){
  if(!S.userId || !id) return;
  const { error } = await sb.from('journal_entries').update({ ticker:entry.ticker, side:entry.side, qty:entry.qty||null, entry_price:entry.entryPrice||null, exit_price:entry.exitPrice||null, reasoning:entry.reason||'', notes:entry.notes||'', lessons_learned:entry.whatWentWell||'',
    details:{ strategy:entry.strategy||'', confidence:entry.confidence||null, expectedOutcome:entry.expectedOutcome||'', actualOutcome:entry.actualOutcome||'', whatWentWrong:entry.whatWentWrong||'', date:entry.date||null, exitDate:entry.exitDate||null } }).eq('id', id).eq('user_id', S.userId);
  if(error) console.warn('Journal update failed', error);
}
async function persistLessonComplete(lessonId){ if(!S.userId) return; const r = await sb.from('completed_lessons').insert({user_id:S.userId, lesson_id:lessonId}); if(r.error && r.error.code!=='23505') console.warn(r.error); }
async function persistBadge(badgeId){ if(!S.userId) return; const r = await sb.from('badges').insert({user_id:S.userId, badge_id:badgeId}); if(r.error && r.error.code!=='23505') console.warn(r.error); }
async function persistXP(sourceKey, amount, reason){
  if(!S.userId) return true;
  const { error } = await sb.from('xp_events').insert({ user_id:S.userId, source_key:sourceKey, amount:amount, reason:reason });
  if(error){ if(error.code==='23505') return false; console.warn('XP event save failed', error); }
  return true;
}
async function persistNotifRead(id, allRead){
  if(!S.userId) return;
  if(allRead){ const r = await sb.from('notifications').update({read:true}).eq('user_id',S.userId); if(r.error) console.warn(r.error); }
  else { const r = await sb.from('notifications').update({read:true}).eq('id',id); if(r.error) console.warn(r.error); }
}
async function persistPendingOrder(order){
  if(!S.userId) return null;
  const { data, error } = await sb.from('pending_orders').insert({ user_id:S.userId, ticker:order.ticker, side:order.side, qty:order.qty, limit_price:order.limitPrice, status:'pending' }).select().single();
  if(error){ console.warn('Pending order save failed', error); return null; }
  return data.id;
}
async function persistOrderStatus(id, status, reason){ if(!S.userId) return; const payload = {status:status, updated_at:new Date().toISOString()}; if(reason) payload.reject_reason = reason; const r = await sb.from('pending_orders').update(payload).eq('id',id); if(r.error){ console.warn(r.error); toast("Couldn't save order status. Please refresh to confirm.", '⚠️'); } }

/* ---------- SESSION BOOT ---------- */
async function bootAuth(){
  if(BACKEND_UNAVAILABLE){ render(); toast('Could not reach the backend service. You can browse, but sign-in and saving are unavailable right now.', '⚠️'); return; }
  const { data: { session } } = await sb.auth.getSession();
  if(session){
    await hydrateUserData();
    S.screen = 'app';
    S.route = 'dashboard';
  }
  render();
  startLimitOrderEngine();
}
if(sb) sb.auth.onAuthStateChange(function(event){ if(event==='SIGNED_OUT'){ Object.assign(S, freshLocalState()); } });

/* ---------- LIMIT ORDER ENGINE ----------
   Runs every 4s while the app tab is open: checks each pending order's
   ticker against the current simulated price and executes it the moment
   the condition is met (buy limit: price <= limit; sell limit: price >= limit). */
function startLimitOrderEngine(){
  if(window._limitEngineStarted) return;
  window._limitEngineStarted = true;
  setInterval(function(){
    if(!S.userId || S.screen!=='app' || !S.pendingOrders) return;
    let changed = false;
    S.pendingOrders.forEach(function(o){
      if(o.status!=='pending') return;
      const s = stock(o.ticker);
      const hit = o.side==='buy' ? s.price <= o.limitPrice : s.price >= o.limitPrice;
      if(hit) executePendingOrder(o);
      changed = changed || hit;
    });
    if(changed) render();
  }, 4000);
}
function executePendingOrder(o){
  const s = stock(o.ticker);
  const total = o.qty * s.price;
  if(o.side==='buy'){
    if(total > S.cash){
      o.status = 'rejected'; o.rejectReason = 'Insufficient virtual cash at execution time';
      persistOrderStatus(o.id, 'rejected', o.rejectReason);
      toast(`Order rejected: insufficient virtual cash for ${o.qty} ${s.t} @ ${fmtINR(s.price,2)}.`, '❌');
      return;
    }
    S.cash -= total;
    const h = S.holdings[s.t];
    if(h){ h.avgPrice = (h.avgPrice*h.qty + total)/(h.qty+o.qty); h.qty += o.qty; } else S.holdings[s.t] = {qty:o.qty, avgPrice:s.price};
    persistHolding(s.t);
  } else {
    const h = S.holdings[s.t];
    if(!h || h.qty < o.qty){
      o.status = 'rejected'; o.rejectReason = 'Insufficient shares available at execution time';
      persistOrderStatus(o.id, 'rejected', o.rejectReason);
      toast(`Order rejected: you no longer hold enough ${s.t} to sell ${o.qty} shares.`, '❌');
      return;
    }
    S.cash += total;
    h.qty -= o.qty; if(h.qty===0) delete S.holdings[s.t];
    persistHolding(s.t);
  }
  o.status = 'executed';
  persistOrderStatus(o.id, 'executed');
  const tx = {id:Date.now(), ticker:s.t, side:o.side, qty:o.qty, price:s.price, total:total, date:new Date().toISOString().slice(0,10), orderType:'limit'};
  S.transactions.unshift(tx); persistTransaction(tx);
  persistProfileSoon();
  toast('Limit ' + o.side + ' order filled: ' + o.qty + ' ' + s.t + ' @ ' + fmtINR(s.price,2), '✅');
}
function cancelPendingOrder(id){
  const o = S.pendingOrders.find(function(x){ return x.id===id; }); if(!o || o.status!=='pending') return;
  o.status='cancelled'; persistOrderStatus(id,'cancelled'); render();
  toast('Order cancelled');
}

</script>
<script>
/* =========================================================================
   REAL MARKET DATA — Alpha Vantage via the market-data edge function.
   Everything here is budget-aware: the free tier is 25 requests/day for
   the WHOLE SITE, so we read the shared Supabase cache directly (free)
   wherever possible, and only call the edge function (which may spend
   budget) when the user explicitly needs fresher data.
   ========================================================================= */
const MD = { searchCache:{}, quoteCache:{}, overviewCache:{}, dailyCache:{}, lastBudgetNote:null };

async function mdCall(action, params){
  const resp = await fetch(SUPA_URL + '/functions/v1/market-data', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(Object.assign({action}, params))
  });
  let body;
  try{ body = await resp.json(); }catch(e){ throw new Error('Market data service returned an unexpected response.'); }
  if(!resp.ok) throw new Error((body && body.error) || ('Market data error (' + resp.status + ')'));
  if(body.stale) MD.lastBudgetNote = body.note || 'Showing last known data — daily quota reached.';
  return body;
}

// Free, zero-budget: read whatever's already cached for a batch of symbols directly from Postgres.
async function mdReadCachedQuotes(symbols){
  if(!sb || !symbols.length) return {};
  const keys = symbols.map(s=>'quote:'+s.toUpperCase());
  const { data, error } = await sb.from('market_data_cache').select('*').in('cache_key', keys);
  if(error){ console.warn(error); return {}; }
  const out = {};
  (data||[]).forEach(row=>{ out[row.symbol] = { payload: row.payload, fetchedAt: row.fetched_at, stale: (Date.now()-new Date(row.fetched_at).getTime()) > 6*60*60*1000 }; });
  return out;
}

function parseQuote(raw){
  if(!raw || typeof raw.c !== 'number' || !isFinite(raw.c) || raw.c<=0) return null;
  const num = (v, fallback) => (typeof v==='number' && isFinite(v)) ? v : fallback;
  return {
    price: raw.c,
    change: num(raw.d, 0),
    changePct: num(raw.dp, 0),
    prevClose: num(raw.pc, raw.c),
    high: num(raw.h, raw.c),
    low: num(raw.l, raw.c),
    open: num(raw.o, raw.c),
    tradingDay: raw.t ? new Date(raw.t*1000).toISOString().slice(0,10) : null,
  };
}
function parseOverview(raw){
  if(!raw || (!raw.ticker && !raw.name)) return null;
  const m = raw.metric || {};
  const n = v => (v===undefined||v===null) ? null : v;
  return {
    name: n(raw.name), sector: n(raw.finnhubIndustry), industry: n(raw.finnhubIndustry), description: null, // Finnhub's free profile2 doesn't include a text description
    exchange: n(raw.exchange), country: n(raw.country), employees: null, logo: n(raw.logo), weburl: n(raw.weburl),
    marketCap: n(raw.marketCapitalization) ? raw.marketCapitalization*1e6 : null, // Finnhub reports marketCap in millions
    pe: n(m.peBasicExclExtraTTM ?? m.peTTM ?? m.peExclExtraTTM),
    eps: n(m.epsBasicExclExtraItemsTTM ?? m.epsTTM),
    dividendYield: n(m.dividendYieldIndicatedAnnual) ? m.dividendYieldIndicatedAnnual/100 : null,
    week52High: n(m['52WeekHigh']), week52Low: n(m['52WeekLow']),
    revGrowth: n(m.revenueGrowthTTMYoy) ? m.revenueGrowthTTMYoy/100 : null,
  };
}
function parseDaily(raw){
  if(!raw || raw.s!=='ok' || !raw.t) return [];
  return raw.t.map((ts,i)=>({date: new Date(ts*1000).toISOString().slice(0,10), close: raw.c[i]}));
}
function fmtMarketCap(v, currency){
  if(v===null||v===undefined) return 'N/A';
  const n = parseFloat(v); if(isNaN(n)) return 'N/A';
  const sym = currency||'$';
  if(n>=1e12) return sym+(n/1e12).toFixed(2)+'T';
  if(n>=1e9) return sym+(n/1e9).toFixed(2)+'B';
  if(n>=1e6) return sym+(n/1e6).toFixed(2)+'M';
  return sym+n.toLocaleString();
}
function fmtOrNA(v, prefix, suffix){ return (v===null||v===undefined) ? 'N/A' : `${prefix||''}${v}${suffix||''}`; }

async function searchSymbols(query){
  if(!query || query.trim().length<1) return [];
  const key = query.toLowerCase().trim();
  if(MD.searchCache[key]) return MD.searchCache[key];
  const res = await mdCall('search', {query});
  const matches = (res.data && res.data.result) || [];
  // Free-tier search returns global results, but quote/profile only work for US symbols — filter to plain US tickers (no exchange suffix like .TO, .L, etc).
  const parsed = matches.filter(m=>m.symbol && !m.symbol.includes('.')).map(m=>({ symbol:m.symbol, name:m.description, type:m.type, region:'United States', currency:'USD' }));
  MD.searchCache[key] = parsed;
  return parsed;
}
async function fetchQuote(symbol, forceLive){
  symbol = symbol.toUpperCase();
  if(!forceLive){
    const cached = await mdReadCachedQuotes([symbol]);
    if(cached[symbol] && !cached[symbol].stale) return { quote: parseQuote(cached[symbol].payload), fetchedAt: cached[symbol].fetchedAt, stale:false, fromCache:true };
  }
  const res = await mdCall('quote', {symbol});
  return { quote: parseQuote(res.data), fetchedAt: res.fetchedAt, stale: !!res.stale, fromCache: res.source==='cache' };
}
async function fetchOverview(symbol){
  const res = await mdCall('overview', {symbol});
  return { overview: parseOverview(res.data), fetchedAt: res.fetchedAt, stale: !!res.stale };
}
async function fetchDaily(symbol){
  const res = await mdCall('daily', {symbol});
  return { series: parseDaily(res.data), fetchedAt: res.fetchedAt, stale: !!res.stale };
}
async function fetchFeaturedWithQuotes(){
  if(!sb) return [];
  const { data: symbols, error } = await sb.from('featured_symbols').select('*').order('symbol');
  if(error || !symbols) return [];
  const quotes = await mdReadCachedQuotes(symbols.map(s=>s.symbol));
  return symbols.map(s=>({ ...s, quote: quotes[s.symbol] ? parseQuote(quotes[s.symbol].payload) : null, fetchedAt: quotes[s.symbol]?.fetchedAt, stale: quotes[s.symbol]?.stale }));
}

</script>

 {id:'l10', cat:'Fundamental Analysis', title:'The P/E Ratio', sub:'How many rupees you pay for one rupee of annual profit.', mins:4, quizCount:2,
  body:"The Price-to-Earnings (P/E) ratio compares a company's share price to its earnings per share (EPS). It tells you how much investors are willing to pay for ₹1 of the company's profit.\n\nA high P/E can mean investors expect strong future growth (or that the stock is overvalued). A low P/E can mean the stock is undervalued (or that growth expectations are low).",
  example:"A stock trading at ₹500 with an EPS of ₹25 has a P/E of 20 — investors are paying ₹20 for every ₹1 of annual profit.",
  takeaway:"P/E is a useful starting point for valuation, but it's most meaningful when compared across similar companies in the same sector.",
  quiz:{q:'A P/E ratio of 20 means investors are paying:', options:['₹20 for every ₹1 of yearly profit','20% interest per year','₹20 total for the stock','20 times the dividend'], correct:0}},
 {id:'l11', cat:'Fundamental Analysis', title:'Return on Equity (ROE)', sub:'How efficiently a company turns shareholder money into profit.', mins:3, quizCount:1,
  body:"Return on Equity (ROE) measures how efficiently a company generates profit from the money shareholders have invested in it, calculated as Net Profit ÷ Shareholder Equity.\n\nA consistently high ROE can signal a strong, efficiently-run business — but very high ROE can also come from heavy borrowing, so it's worth checking alongside debt levels.",
  example:"A company with ₹50 crore in shareholder equity that earns ₹10 crore profit has an ROE of 20%.",
  takeaway:"ROE shows how well management turns shareholders' capital into profit — but should be read alongside debt.",
  quiz:{q:'Return on Equity is calculated as:', options:['Net Profit ÷ Revenue','Net Profit ÷ Shareholder Equity','Revenue ÷ Total Assets','Dividend ÷ Share Price'], correct:1}},
 {id:'l12', cat:'Fundamental Analysis', title:'Debt-to-Equity', sub:'How much of the business is funded by borrowing.', mins:3, quizCount:1,
  body:"The Debt-to-Equity (D/E) ratio compares a company's total debt to its shareholder equity, showing how much of the business is financed by borrowing versus owners' capital.\n\nA higher D/E means more reliance on debt, which can amplify both gains and losses — and adds risk if earnings fall while interest payments stay fixed.",
  example:"A company with ₹40 crore in debt and ₹80 crore in equity has a debt-to-equity ratio of 0.5.",
  takeaway:"Some debt is normal, but a rising debt-to-equity ratio is worth watching alongside a company's ability to pay it back.",
  quiz:{q:'A high debt-to-equity ratio generally indicates:', options:['The company has no liabilities','Heavier reliance on borrowed money','Guaranteed higher profits','Lower business risk'], correct:1}},
 {id:'l13', cat:'Fundamental Analysis', title:'Cash Flow', sub:'Profit is an opinion; cash is a fact.', mins:4, quizCount:1,
  body:"Cash flow tracks the actual cash moving in and out of a business — separate from accounting profit, which can include non-cash items. A company can report a profit on paper while struggling with actual cash in the bank.\n\nOperating cash flow, in particular, shows whether the core business is generating real cash from its day-to-day operations.",
  example:"A company might report ₹10 crore in profit but only ₹2 crore in actual operating cash flow if much of that profit is tied up in unpaid customer invoices.",
  takeaway:"Strong, consistent operating cash flow is often a healthier sign than profit figures alone.",
  quiz:{q:'Why can cash flow differ from reported profit?', options:['Profit always equals cash','Profit includes non-cash accounting items','Cash flow ignores expenses entirely','They are always identical'], correct:1}},

 // ---------- TECHNICAL ANALYSIS ----------
 {id:'l14', cat:'Technical Analysis', title:'Candlesticks', sub:'A compact way to read open, high, low and close.', mins:4, quizCount:1,
  body:"A candlestick shows four prices for a period: open, high, low and close. The 'body' shows the range between open and close; the 'wicks' show the high and low reached during that period.\n\nA green/filled candle typically means the price closed higher than it opened. A red/hollow candle means it closed lower.",
  example:"A long green candle with small wicks suggests strong, steady buying pressure throughout that period.",
  takeaway:"Candlesticks compress a lot of price-action information — open, high, low, close — into one simple shape.",
  quiz:{q:'A candlestick shows which four data points?', options:['Volume, RSI, MACD, Trend','Open, High, Low, Close','Buyers, Sellers, News, Sentiment','P/E, EPS, ROE, Dividend'], correct:1}},
 {id:'l15', cat:'Technical Analysis', title:'Support & Resistance', sub:'Price zones where supply and demand have repeatedly met.', mins:4, quizCount:1,
  body:"Support is a price level where a falling stock has historically found buyers, causing it to bounce. Resistance is a level where a rising stock has historically met sellers, causing it to pull back.\n\nThese levels form because traders remember past prices and often act around them — they are zones of past decision-making, not guaranteed floors or ceilings.",
  example:"If a stock has bounced off ₹1,000 three times in the last year, traders may watch ₹1,000 as a support level.",
  takeaway:"Support and resistance are useful reference zones, but prices can and do break through them.",
  quiz:{q:'Support is best described as a level where a falling stock has:', options:['Always crashed further','Historically found buyers and bounced','Been delisted','Doubled in price'], correct:1}},
 {id:'l16', cat:'Technical Analysis', title:'Moving Averages', sub:'Smoothing noisy price into a readable trend.', mins:4, quizCount:1,
  body:"A moving average smooths out short-term price noise by averaging closing prices over a set period (like 50 or 200 days), making the underlying trend easier to see.\n\nWhen price trades above a rising moving average, it's often read as a sign of an uptrend; below a falling average, a downtrend.",
  example:"A 50-day moving average that's sloping upward, with price consistently above it, is often read as a healthy short-term uptrend.",
  takeaway:"Moving averages don't predict the future — they simply smooth the past to make trends easier to see.",
  quiz:{q:'A moving average is primarily used to:', options:['Predict exact future prices','Smooth price data to reveal the underlying trend','Calculate dividend yield','Replace fundamental analysis entirely'], correct:1}},
 {id:'l17', cat:'Technical Analysis', title:'Volume', sub:'How much conviction sits behind a price move.', mins:3, quizCount:1,
  body:"Volume is the number of shares traded during a given period. It reflects how much conviction — or participation — is behind a price move.\n\nA price move on high volume is generally considered more meaningful than the same move on low volume, which may just be noise.",
  example:"A stock jumping 5% on unusually high volume suggests strong, broad buying interest rather than a single small trade.",
  takeaway:"Volume adds context to price moves — big moves on low volume deserve more scepticism.",
  quiz:{q:'High volume behind a price move generally suggests:', options:['The move is likely meaningless','Stronger conviction behind the move','The stock will be delisted','Lower liquidity'], correct:1}},
 {id:'l18', cat:'Technical Analysis', title:'Trends', sub:'Higher highs, lower lows, and long sideways stretches.', mins:3, quizCount:1,
  body:"A trend describes the general direction prices are moving over time. An uptrend shows a pattern of higher highs and higher lows; a downtrend shows lower highs and lower lows. Prices can also move sideways for extended periods with no clear trend.\n\nRecognising the type of trend helps set realistic expectations rather than assuming every move continues forever.",
  example:"A stock making higher highs and higher lows over several months is in a clear uptrend, even with normal day-to-day dips.",
  takeaway:"Trends describe direction over time — not a guarantee that the direction continues.",
  quiz:{q:'An uptrend is typically characterised by:', options:['Lower highs and lower lows','Higher highs and higher lows','No price movement at all','Random daily moves only'], correct:1}},
 {id:'l19', cat:'Technical Analysis', title:'RSI', sub:'A momentum oscillator between 0 and 100.', mins:4, quizCount:1,
  body:"The Relative Strength Index (RSI) is a momentum indicator scaled between 0 and 100 that measures the speed and size of recent price changes. Readings above 70 are often read as 'overbought'; below 30 as 'oversold'.\n\nRSI is a supporting tool, not a standalone signal — extreme readings can persist longer than expected in strong trends.",
  example:"A stock with an RSI of 78 has risen sharply and quickly, which some traders read as a caution sign for a possible pause or pullback.",
  takeaway:"RSI helps gauge momentum extremes, but should be combined with other context before acting on it.",
  quiz:{q:'RSI is scaled between:', options:['-100 and 100','0 and 100','0 and 10','1 and 5'], correct:1}},

 // ---------- RISK MANAGEMENT ----------
 {id:'l20', cat:'Risk Management', title:'Diversification', sub:'Not letting one mistake decide your outcome.', mins:4, quizCount:1,
  body:"Diversification means spreading your investments across different stocks, sectors, or asset classes so that no single position can severely damage your portfolio.\n\nIt doesn't eliminate risk, but it reduces the impact of any one company or sector performing badly.",
  example:"A portfolio with 90% in one technology stock is far riskier than one spread across technology, banking, healthcare, and energy.",
  takeaway:"Diversification trades away some upside concentration for meaningfully lower overall portfolio risk.",
  quiz:{q:'The main purpose of diversification is to:', options:['Guarantee profits','Reduce the impact of any single position underperforming','Avoid paying taxes','Increase leverage'], correct:1}},
 {id:'l21', cat:'Risk Management', title:'Position Sizing', sub:'Deciding how much, not just what.', mins:4, quizCount:1,
  body:"Position sizing is deciding how much money to put into a single trade relative to your total capital. Even a great strategy can hurt you if any one position is too large.\n\nA common guideline is risking only a small, fixed percentage of your total capital on any single trade — often around 1–2%.",
  example:"Risking 2% of your capital per trade means a string of losses is far less likely to wipe out your account than risking 20% per trade.",
  takeaway:"How much you allocate to each trade often matters more to long-term results than which stock you pick.",
  quiz:{q:'Position sizing is primarily concerned with:', options:['Which stock to pick','How much capital to risk on a single trade','The exact time of day to trade','The company\'s logo design'], correct:1}},
 {id:'l22', cat:'Risk Management', title:'Risk vs Reward', sub:'Win rate and payoff size together decide the result.', mins:3, quizCount:1,
  body:"Risk/reward ratio compares your potential loss to your potential gain on a trade. A common guideline is seeking at least 1:2 — risking ₹1 to potentially make ₹2 or more.\n\nA good risk/reward ratio can still lose money with a low win rate, and a poor ratio can still profit with a very high win rate — the two work together.",
  example:"A trader who wins only 40% of trades can still be profitable if their average win is meaningfully larger than their average loss.",
  takeaway:"Profitability depends on win rate and payoff size together, not either one alone.",
  quiz:{q:'A 1:2 risk/reward ratio means you are:', options:['Risking ₹2 to make ₹1','Risking ₹1 to potentially make ₹2','Guaranteed to double your money','Splitting a trade in two'], correct:1}},
 {id:'l23', cat:'Risk Management', title:'Volatility', sub:'How much and how fast prices move around.', mins:3, quizCount:1,
  body:"Volatility measures how much and how quickly a stock's price swings, up or down, over a given period. Higher volatility means larger, faster price swings — both gains and losses can be bigger.\n\nVolatility isn't inherently bad, but it does mean more uncertainty in the short term, which matters for position sizing and risk tolerance.",
  example:"A young technology stock might swing 5% in a single day, while a large, stable utility company might move less than 1%.",
  takeaway:"Higher volatility means bigger potential swings in both directions — size positions accordingly.",
  quiz:{q:'High volatility mainly indicates:', options:['Guaranteed losses','Larger and faster price swings','A company is about to be delisted','No trading activity'], correct:1}},
 {id:'l24', cat:'Risk Management', title:'Drawdowns', sub:'The peak-to-trough fall — and the maths of recovery.', mins:4, quizCount:1,
  body:"A drawdown measures how far a portfolio has fallen from its most recent peak. It's a key way to understand real, lived risk — not just average returns.\n\nRecovering from a drawdown gets mathematically harder the deeper it goes: a 50% loss requires a 100% gain just to break even.",
  example:"A portfolio that falls from ₹1,00,000 to ₹80,000 has experienced a 20% drawdown, and needs a 25% gain to recover to its old peak.",
  takeaway:"Deep drawdowns require disproportionately larger gains to recover — protecting capital matters as much as growing it.",
  quiz:{q:'To recover from a 50% drawdown, a portfolio needs a gain of:', options:['50%','75%','100%','25%'], correct:2}},

 // ---------- PORTFOLIO MANAGEMENT ----------
 {id:'l25', cat:'Portfolio Management', title:'Asset Allocation', sub:'The split between asset classes drives most of your outcome.', mins:4, quizCount:1,
  body:"Asset allocation is how you divide your capital across different asset classes and sectors based on your goals, time horizon, and risk tolerance.\n\nResearch consistently shows that the broad allocation decision tends to explain more of a portfolio's long-run results than the specific securities picked within it.",
  example:"An investor with a long time horizon might allocate more heavily to equities, while someone nearing a goal might shift toward safer, lower-volatility holdings.",
  takeaway:"Getting the broad allocation right matters more, over time, than picking the 'perfect' individual stock.",
  quiz:{q:'Asset allocation primarily refers to:', options:['Picking the single best stock','Dividing capital across asset classes and sectors','Timing the market perfectly','Only investing in dividend stocks'], correct:1}},
 {id:'l26', cat:'Portfolio Management', title:'Sector Diversification', sub:'Spreading exposure across different economic drivers.', mins:3, quizCount:1,
  body:"Sector diversification means holding companies from different industries — like technology, banking, healthcare, and energy — rather than concentrating in just one.\n\nDifferent sectors often respond differently to the same economic conditions, so spreading exposure can smooth out a portfolio's overall ride.",
  example:"Rising interest rates might pressure real estate stocks while benefiting bank stocks — a portfolio holding both is less exposed to either single outcome.",
  takeaway:"Different sectors react differently to the same events — spreading across them reduces that single-sector risk.",
  quiz:{q:'Sector diversification helps because different sectors:', options:['Always move in the exact same direction','Often respond differently to the same economic conditions','Are all equally risky','Never generate profit at the same time'], correct:1}},
 {id:'l27', cat:'Portfolio Management', title:'Rebalancing', sub:'Returning the portfolio to its intended shape.', mins:4, quizCount:1,
  body:"Over time, winners grow larger and losers shrink, drifting your portfolio away from its original target allocation. Rebalancing means periodically adjusting holdings back toward that target.\n\nThis often means trimming positions that have grown disproportionately large and adding to those that have fallen behind — a disciplined way of 'buying low, selling high'.",
  example:"If technology grows from 25% to 45% of your portfolio after a rally, rebalancing might mean trimming some technology and adding to underweight sectors.",
  takeaway:"A portfolio's allocation drifts on its own — rebalancing is how you keep risk in line with your original plan.",
  quiz:{q:'Rebalancing a portfolio primarily means:', options:['Selling everything and starting over','Adjusting holdings back toward your target allocation','Buying only the top-performing stock','Switching to bonds permanently'], correct:1}},
 {id:'l28', cat:'Portfolio Management', title:'Long-Term Investing', sub:'Compounding, costs and the value of staying invested.', mins:4, quizCount:1,
  body:"Long-term investing relies on compounding — reinvested gains generating their own further gains over time — and tends to reduce the impact of short-term volatility and trading costs compared to frequent trading.\n\nStaying invested through market cycles, rather than trying to perfectly time entries and exits, has historically been a difficult strategy to consistently beat.",
  example:"₹1,00,000 growing at an average 10% a year roughly doubles in about 7 years through the power of compounding alone.",
  takeaway:"Time in the market, and the discipline to stay invested, is often a bigger driver of results than timing the market.",
  quiz:{q:'Compounding refers to:', options:['A one-time fixed bonus','Reinvested gains generating further gains over time','A type of brokerage fee','Guaranteed annual returns'], correct:1}},
];

function fmtINR(n, decimals=0){ if(typeof n!=='number' || !isFinite(n)) return '₹—'; const sign=n<0?'-':''; n=Math.abs(n); return sign+'₹'+n.toLocaleString('en-IN',{maximumFractionDigits:decimals, minimumFractionDigits:decimals}); }
function fmtNum(n, d=2){ if(typeof n!=='number' || !isFinite(n)) return '—'; return n.toLocaleString('en-IN',{maximumFractionDigits:d, minimumFractionDigits:d}); }
function pctStr(n){ if(typeof n!=='number' || !isFinite(n)) return '—'; return (n>=0?'+':'')+n.toFixed(2)+'%'; }
function levelFromXP(xp){ const t=[0,100,300,600,1000,1500]; let lvl=1; for(let i=1;i<t.length;i++){ if(xp>=t[i]) lvl=i+1; } return Math.min(lvl,5); }
const LEVEL_NAMES = {1:'Market Rookie',2:'Market Explorer',3:'Trading Apprentice',4:'Market Analyst',5:'Portfolio Pro'};
function xpToNext(xp){ const t=[0,100,300,600,1000,1500]; const lvl=levelFromXP(xp); if(lvl>=5) return {cur:xp,next:xp,pct:100}; const lo=t[lvl-1], hi=t[lvl]; return {cur:xp-lo, next:hi-lo, pct:Math.round((xp-lo)/(hi-lo)*100)}; }

function toast(msg, icon){ const w=document.getElementById('toastWrap'); const el=document.createElement('div'); el.className='toast'; el.innerHTML=(icon?icon+' ':'')+msg; w.appendChild(el); setTimeout(()=>el.remove(), 3600); }

const USD_TO_INR = 83; // fixed approximate rate — used only to keep portfolio totals in a single currency (₹) when mixing simulated (₹) and real US ($) stocks
const REAL_QUOTES = {}; // symbol -> shim object shaped like a STOCKS entry (price stored as INR-equivalent so ALL existing portfolio math stays single-currency)
function stock(ticker){
  const sim = STOCKS.find(s=>s.t===ticker);
  if(sim) return sim;
  if(REAL_QUOTES[ticker]) return REAL_QUOTES[ticker];
  return { t:ticker, name:ticker, sector:'Other', price:0, changePct:0, prevClose:0, vol:0.1, marketCap:'N/A', pe:null, eps:null, roe:null, de:null, div:null, revGrowth:null, high52:null, low52:null, desc:'', isReal:true, unresolved:true, nativeCurrency: currencyFor(ticker) };
}
function updateRealQuoteShim(symbol, quoteResult, overviewResult){
  const q = quoteResult && quoteResult.quote;
  const ov = overviewResult && overviewResult.overview;
  const prev = REAL_QUOTES[symbol] || {};
  const curr = currencyFor(symbol);
  const fx = curr==='$' ? USD_TO_INR : 1; // convert native price to INR-equivalent for internal accounting only
  REAL_QUOTES[symbol] = {
    t: symbol, name: (ov && ov.name) || prev.name || symbol,
    sector: (ov && ov.sector) || prev.sector || 'Other',
    price: q ? q.price*fx : (prev.price||0),           // INR-equivalent — used by portfolioValue/holdings/doctor etc
    nativePrice: q ? q.price : (prev.nativePrice||0),   // real native-currency price — used for display only
    nativeCurrency: curr,
    changePct: q ? q.changePct : (prev.changePct||0),
    prevClose: q ? q.prevClose*fx : (prev.prevClose||0),
    vol: 0.15, isReal:true, unresolved:false,
    marketCap: (ov && ov.marketCap) || prev.marketCap || null,
    pe: (ov && ov.pe) || prev.pe || null,
    eps: (ov && ov.eps) || prev.eps || null,
    div: (ov && ov.dividendYield) || prev.div || null,
    revGrowth: (ov && ov.revGrowth) || prev.revGrowth || null,
    high52: (ov && ov.week52High) || prev.high52 || null,
    low52: (ov && ov.week52Low) || prev.low52 || null,
    desc: (ov && ov.description) || prev.desc || '',
    exchange: (ov && ov.exchange) || prev.exchange || '',
    industry: (ov && ov.industry) || prev.industry || '',
    country: (ov && ov.country) || prev.country || '',
    employees: (ov && ov.employees) || prev.employees || null,
    fetchedAt: (quoteResult&&quoteResult.fetchedAt) || (overviewResult&&overviewResult.fetchedAt) || prev.fetchedAt,
    stale: (quoteResult&&quoteResult.stale) || (overviewResult&&overviewResult.stale) || false,
  };
  return REAL_QUOTES[symbol];
}
function holdingsValue(){ return Object.entries(S.holdings).reduce((sum,[t,h])=> sum + h.qty*stock(t).price, 0); }
function portfolioValue(){ return S.cash + holdingsValue(); }
function todayPnL(){ return Object.entries(S.holdings).reduce((sum,[t,h])=>{ const st=stock(t); return sum + h.qty*(st.price-st.prevClose); },0); }
function totalPnL(){ return portfolioValue()-100000; }

/* live price jitter */
function jitterMarket(){
  STOCKS.forEach(s=>{ s.prevClose = s.price; const rnd=(Math.random()-0.5); s.price = Math.max(1, s.price*(1+rnd*s.vol*0.012)); s.changePct = (s.price-s.base)/s.base*100; });
  INDICES.forEach(i=>{ i.prevClose=i.price; const rnd=(Math.random()-0.5); i.price=Math.max(1,i.price*(1+rnd*i.vol*0.006)); i.changePct=(i.price-i.base)/i.base*100; });
  if(S.screen==='app') render();
}
setInterval(jitterMarket, 5000);

  clearTimeout(_compareSearchDebounce);

function addToCompare(symbol){
  if((S.compareList||[]).length>=4){ toast('You can compare up to 4 stocks'); return; }

  const inp=document.getElementById('compareSearchInput'); if(inp) inp.value='';
  const res=document.getElementById('compareSearchResults'); if(res) res.innerHTML='';
  const s = stock(symbol);
  if(s.unresolved && realStockLoadState[symbol]===undefined){ realStockLoadState[symbol]='loading'; loadRealStockData(symbol); }
  render();
}

async function loadMissingFeaturedPrices(){
  if(S.loadingFeaturedPrices || !Array.isArray(S.featuredList)) return;
  const MAX_PER_CLICK = 8; // safety cap: don't let one click burn the whole shared 25/day budget
  const missing = S.featuredList.filter(f=>!f.quote).map(f=>f.symbol).slice(0, MAX_PER_CLICK);
  if(missing.length===0) return;
  S.loadingFeaturedPrices = true; render();
  // Fetch sequentially (not in parallel) so we stop cleanly the moment the shared daily budget runs out,
  // instead of firing a burst of simultaneous requests that could all fail at once.
  for(const sym of missing){
    try{
      const res = await fetchQuote(sym, true);
      if(res.quote){
        const idx = S.featuredList.findIndex(f=>f.symbol===sym);
        if(idx>-1) S.featuredList[idx] = {...S.featuredList[idx], quote: res.quote, fetchedAt: res.fetchedAt, stale: res.stale};
        render();
      }
    }catch(e){
      console.warn('Could not load price for', sym, e.message);
      if(/quota/i.test(e.message||'')){ toast('Daily shared quota reached — remaining prices will load another time.', '⚠️'); break; }
    }
  }
  S.loadingFeaturedPrices = false; render();
}

// Polls this symbol's quote every ~12s (matching the edge function's cache TTL, so we're never
// paying for data fresher than what's actually available) for a near-real-time feel, WITHOUT
// exposing any API key client-side. Self-terminates the moment the user navigates away, so it
// can never leak — only one poll loop is ever active at a time.
let _stockPollTimer = null;
function startStockQuotePolling(symbol){
  if(_stockPollTimer) clearInterval(_stockPollTimer);
  _stockPollTimer = setInterval(async ()=>{
    if(S.route!=='stock' || S.selectedTicker!==symbol){ clearInterval(_stockPollTimer); _stockPollTimer=null; return; }
    try{
      const quoteRes = await fetchQuote(symbol, true);
      if(quoteRes.quote){ updateRealQuoteShim(symbol, quoteRes, null); render(); }
    }catch(e){ /* silent — next poll will retry; don't spam toasts for a background refresh */ }
  }, 12000);
}
function currencyFor(symbol){ return symbol.endsWith('.BSE') || symbol.endsWith('.NSE') ? '₹' : '$'; }
function fmtPrice(symbol, v, dp){ if(v===null||v===undefined||isNaN(v)) return 'N/A'; return currencyFor(symbol) + Number(v).toLocaleString('en-US',{minimumFractionDigits:dp!==undefined?dp:2, maximumFractionDigits:dp!==undefined?dp:2}); }

function computeDoctor(){
  const rows = Object.entries(S.holdings);
  const pv = portfolioValue();
  const hv = holdingsValue();
  if(rows.length===0){
    const cashRatio = 1;
    return {overall:48, diversification:0, concentration:100, sectorBalance:100, risk:100, performance:45, cashDeployment:45,
      sectorPct:[], maxSector:0, maxHolding:0, numSectors:0, cashRatio};
  }
  const bySector = {};
  rows.forEach(([t,h])=>{ const s=stock(t); const val=h.qty*s.price; bySector[s.sector]=(bySector[s.sector]||0)+val; });
  const sectorPct = Object.entries(bySector).map(([sec,val])=>({sec, pct: val/hv*100})).sort((a,b)=>b.pct-a.pct);
  const numSectors = sectorPct.length;
  const maxSector = sectorPct[0]?.pct||0;
  const maxHolding = Math.max(...rows.map(([t,h])=> (h.qty*stock(t).price)/hv*100));
  const diversification = Math.max(20, Math.min(100, 30 + numSectors*14 - Math.max(0,maxSector-40)*0.6));
  const concentration = Math.max(15, Math.min(100, 100 - Math.max(0,maxHolding-25)*1.3));
  const sectorBalance = Math.max(20, Math.min(100, 100 - (maxSector-100/Math.max(numSectors,1))*0.9));
  const avgVol = rows.reduce((a,[t,h])=>a+stock(t).vol*(h.qty*stock(t).price/hv),0);
  const risk = Math.max(15, Math.min(100, 100 - avgVol*220));
  const cashRatio = S.cash/pv;
  const cashDeployment = Math.round((1-cashRatio)*100);
  const performance = Math.max(10, Math.min(100, 55 + (totalPnL()/100000*100)*4));
  const overall = Math.round((diversification+concentration+sectorBalance+risk+performance)/5);
  return {overall, diversification:Math.round(diversification), concentration:Math.round(concentration), sectorBalance:Math.round(sectorBalance), risk:Math.round(risk), performance:Math.round(performance), cashDeployment, sectorPct, maxSector, maxHolding, numSectors, cashRatio};
}

function closedStats(){
  const closed = S.journal.filter(e=>e.exitPrice);
  const n = closed.length;
  if(n===0) return null;
  const wins = closed.filter(e=> e.side==='buy'? e.exitPrice>e.entryPrice : e.exitPrice<e.entryPrice);
  const losses = closed.filter(e=> !wins.includes(e));
  const avgWin = wins.length? wins.reduce((a,e)=>a+Math.abs(e.exitPrice-e.entryPrice)*e.qty,0)/wins.length : 0;
  const avgLoss = losses.length? losses.reduce((a,e)=>a+Math.abs(e.exitPrice-e.entryPrice)*e.qty,0)/losses.length : 0;
  const avgHold = closed.reduce((a,e)=>{
    const d1=new Date(e.date), d2=new Date(e.exitDate||e.date);
    const diff = (d2-d1)/86400000;
    return a + (isNaN(diff) ? 0 : Math.max(0, diff));
  },0)/n;
  return {winRate: (wins.length/n*100), avgWin, avgLoss, avgHold, rr: avgLoss? (avgWin/avgLoss):0, n};
}

async function runAIJournalAnalysis(){
  if(S.journal.length===0){ toast('Log a few trades first'); return; }
  if(!S.userId){ toast('Log in to use AI journal analysis'); return; }
  S.aiJournalLoading=true; S.aiJournalError=null; render();
  const stats = closedStats();
  try{
    const prompt = `You are analyzing a beginner trader's paper-trading journal (simulated, no real money). Based ONLY on this data, identify patterns. Respond with ONLY valid JSON, no markdown, no code fences, matching exactly this shape:
{"strengths": ["...","..."], "improvements": ["...","..."], "behavioral": ["...","..."]}
Give 2-3 short items (each under 20 words) per array, phrased as observations from the data, not diagnoses. Journal entries JSON:
${JSON.stringify(S.journal.map(e=>({ticker:e.ticker,side:e.side,qty:e.qty,entryPrice:e.entryPrice,exitPrice:e.exitPrice||null,date:e.date,exitDate:e.exitDate||null,strategy:e.strategy,reason:e.reason,confidence:e.confidence,whatWentWell:e.whatWentWell,whatWentWrong:e.whatWentWrong})))}`;
    const text = await callAI('journal_analysis', prompt);
    const clean = text.replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(clean);
    if(stats) parsed.performance = {winRate: stats.winRate.toFixed(0)+'%', avgWin: fmtINR(Math.round(stats.avgWin)), avgLoss: fmtINR(Math.round(stats.avgLoss)), avgHolding: stats.avgHold.toFixed(1)+' days', riskReward: stats.rr? stats.rr.toFixed(2):'—'};
    S.aiJournalResult = parsed;
  }catch(e){
    S.aiJournalError = e.message && /not configured/i.test(e.message) ? "AI journal analysis isn't configured on this site yet." : "Couldn't analyze your journal right now — please try again.";
  }
  S.aiJournalLoading=false; render();
}

/* ================= CHALLENGES ================= */
function getCurrentChallenge(){
  // Weekly cycle: Monday 00:00 local -> next Monday 00:00, computed off real current date.
  const now = new Date();
  const day = now.getDay(); // 0=Sun..6=Sat
  const diffToMonday = (day===0? -6 : 1-day);
  const start = new Date(now); start.setHours(0,0,0,0); start.setDate(now.getDate()+diffToMonday);
  const end = new Date(start); end.setDate(start.getDate()+7);
  const msLeft = end - now;
  const daysLeft = Math.max(0, Math.ceil(msLeft/(1000*60*60*24)));
  const fmtD = d=>`${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`;
  const weekNum = Math.floor((start - new Date(start.getFullYear(),0,1))/(7*24*60*60*1000))+1;
  return {start, end, daysLeft, label:`Week ${weekNum} Risk-Adjusted Sprint`, dateRange:`${fmtD(start)} → ${fmtD(end)}`,
    endsText: daysLeft<=0 ? 'Ending today' : daysLeft===1 ? 'Ends in 1 day' : `Ends in ${daysLeft} days`};
}
